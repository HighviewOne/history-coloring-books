name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dist/ matches the .jsx sources
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "::error::dist/ is stale — run 'npm run build' and commit the result"; exit 1; }
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
